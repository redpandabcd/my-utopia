<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluet | Biological Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Syncopate:wght@400;700&family=Inter:wght@100;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #64ffda;
            --deep-bg: #02050f;
            --glass: rgba(10, 25, 47, 0.7);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--deep-bg);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #ccd6f6;
        }

        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* 主界面 */
        .radio-frame {
            position: relative;
            z-index: 10;
            width: 380px;
            padding: 60px 40px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 50px;
            border: 1px solid rgba(100, 255, 218, 0.1);
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            animation: breathe 8s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* --- 艺术字体核心修改 --- */
        .halo {
            width: 220px;
            height: 220px;
            margin: 0 auto 40px;
            border-radius: 50%;
            border: 1px solid rgba(100, 255, 218, 0.15);
            display: flex; justify-content: center; align-items: center;
            text-decoration: none;
            position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
            transition: 0.5s;
        }

        .halo:hover { border-color: var(--neon-blue); box-shadow: inset 0 0 50px rgba(100, 255, 218, 0.1); }

        .title { 
            /* 使用艺术字体 */
            font-family: 'Cinzel Decorative', serif; 
            font-size: 2.2rem; 
            letter-spacing: 8px; 
            font-weight: 700;
            color: transparent;
            /* 文字流光效果 */
            background: linear-gradient(to right, #64ffda, #fff, #64ffda);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 4s linear infinite;
            text-shadow: 0 0 15px rgba(100, 255, 218, 0.3);
            margin-left: 8px; /* 修正字母间距导致的视觉不居中 */
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .nav a { 
            text-decoration: none; color: var(--neon-blue); font-size: 0.7rem; 
            font-family: 'Syncopate', sans-serif;
            letter-spacing: 2px; opacity: 0.5; transition: 0.4s;
        }
        .nav a:hover { opacity: 1; text-shadow: 0 0 10px var(--neon-blue); }

        .freq-box { border-top: 1px solid rgba(255,255,255,0.05); padding-top: 30px; }

        .wave-container { display: flex; justify-content: center; gap: 4px; height: 20px; margin-bottom: 20px; }
        .bar { width: 2px; height: 5px; background: var(--neon-blue); opacity: 0.3; border-radius: 2px; animation: wave 1s infinite alternate; }
        @keyframes wave { from { height: 5px; opacity: 0.2; } to { height: 20px; opacity: 0.8; } }

        .listen-btn {
            background: rgba(100, 255, 218, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 12px; padding: 16px;
            display: block; text-decoration: none; color: var(--neon-blue);
            font-size: 0.7rem; font-family: 'Syncopate', sans-serif;
            letter-spacing: 3px; transition: 0.4s;
        }
        .listen-btn:hover { background: rgba(100, 255, 218, 0.15); transform: translateY(-3px); }

        /* 雪花层 */
        #snow-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
        .snowflake { position: absolute; color: #fff; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); user-select: none; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div id="snow-layer"></div>

    <div class="radio-frame" id="mainUI">
        <a href="film.html" class="halo">
            <div class="title">BLUET</div>
        </a>

        <div class="nav">
            <a href="film.html">FILM</a>
            <a href="text.html">TEXT</a>
            <a href="gender.html">GENDER</a>
            <a href="agent.html">AGENT</a>
        </div>

        <div class="freq-box">
            <div id="freq-text" style="font-size: 0.55rem; font-family: 'Syncopate', sans-serif; margin-bottom: 15px; opacity: 0.4; letter-spacing: 4px;">
                SIGNAL // 104.5 MHZ
            </div>
            <div class="wave-container" id="visualizer"></div>
            <a href="https://music.163.com/#/song?id=2079377754" target="_blank" class="listen-btn">
                TUNE IN TO SIGNAL
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const snowLayer = document.getElementById('snow-layer');

        // 1. 粒子背景系统
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.opacity = Math.random();
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0 || this.y > canvas.height || this.y < 0) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(100, 255, 218, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 150; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // 2. 动态波形
        const visualizer = document.getElementById('visualizer');
        for (let i = 0; i < 12; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.animationDelay = `${Math.random()}s`;
            visualizer.appendChild(bar);
        }

        // 3. 强力雪花逻辑
        function createSnowflake() {
            const flake = document.createElement('div');
            flake.className = 'snowflake';
            const icons = ['❄', '·', '°', '❅'];
            flake.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            const left = Math.random() * 100;
            const size = Math.random() * 12 + 10;
            const duration = Math.random() * 5 + 10;
            const opacity = Math.random() * 0.6 + 0.2;

            flake.style.cssText = `
                left: ${left}vw;
                top: -20px;
                font-size: ${size}px;
                opacity: ${opacity};
                animation: fall ${duration}s linear forwards;
            `;

            snowLayer.appendChild(flake);
            setTimeout(() => flake.remove(), duration * 1000);
        }
        setInterval(createSnowflake, 400);

        // 4. 频率跳动
        setInterval(() => {
            const freq = (104.5 + (Math.random() - 0.5) * 0.2).toFixed(1);
            document.getElementById('freq-text').innerText = `SIGNAL // ${freq} MHZ`;
        }, 3000);

        // 5. 鼠标视差
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 30;
            const y = (window.innerHeight / 2 - e.clientY) / 30;
            document.getElementById('mainUI').style.transform = `translate(${-x}px, ${-y}px)`;
        });
    </script>
</body>
</html>
